name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly, Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build (so CodeQL can analyze the real TypeScript sources)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # New dependencies enter the install graph of a tool that can drive
          # an agent, so the bar for a new transitive dep is high.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit production dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund && npm audit --omit=dev --audit-level=moderate
